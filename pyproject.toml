[project]
name = "molecular_qm_models"
dynamic = ["version"]
description = "Molecular QM Models"
requires-python = ">=3.12, <3.13"
dependencies = [
    "pydantic",
    "numpy",
    "simstack",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.version]
source = "vcs"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["molecular_qm_models"]

[project.entry-points."simstack.modules"]
molecular_qm_models = "molecular_qm_models"

[tool.uv.sources]
# Pin to the same simstack release the simstack-model deployment env uses
# (v2.0.1.post7 == commit e88b4b3, the 2.0.1.1-hotfix line with the logging /
# shutdown fixes). Previously `branch = "main"` (and briefly `rev =
# "v2.0.1.post6"`) which made `uv lock`/`uv sync` in the parent repo fail with
# "conflicting URLs for package simstack" (@main/@post6 vs @v2.0.1.post7).
simstack = { git = "https://github.com/simstack/simstack.git", rev = "v2.0.1.post7" }

